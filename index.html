<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>다한닷 · DX·AX 업무보드 체험</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#20352f;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#244b41;color:white;padding:20px max(20px,calc((100vw - 1220px)/2))}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#d5e5e0;font-size:13px}main{max-width:1220px;margin:20px auto;padding:0 15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{cursor:pointer;border:1px solid #c9d7d2;background:white;border-radius:9px;padding:10px 14px;color:#244b41;font-weight:600}button.active{background:#244b41;color:white}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:15px}.panel{background:white;border:1px solid #e1e9e5;border-radius:13px;padding:19px;margin-bottom:14px;box-shadow:0 3px 12px #18382c08}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 6px}.item{padding:13px 0;border-bottom:1px solid #e9eeeb}.item:last-child{border:0}.item p{font-size:13px;color:#526760;line-height:1.7;margin:5px 0}.meta{font-size:12px;color:#6b8178}.tag{display:inline-block;background:#edf3f0;border-radius:5px;padding:3px 7px;font-size:11px;margin-right:7px}a{color:#216e60;text-decoration:none}a:hover{text-decoration:underline}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.links a{border:1px solid #dbe7e1;border-radius:9px;padding:12px}.muted{font-size:12px;color:#687b73;line-height:1.7}.notice{font-size:12px;padding:12px;background:#e7efec;border-radius:9px;margin-bottom:15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cell{min-height:75px;border:1px solid #e2eae5;border-radius:6px;padding:7px;font-size:12px}.cell small{display:block;color:#216e60;font-size:10px;margin-top:6px}.dayhead{font-weight:700;text-align:center;padding:7px}.history{border-left:2px solid #d1ded8;margin-left:8px;padding-left:15px}.history .item{position:relative}.history .item:before{content:'';position:absolute;left:-20px;top:20px;width:8px;height:8px;background:#244b41;border-radius:50%}@media(max-width:780px){.layout{grid-template-columns:1fr}.links{grid-template-columns:1fr}.cell{min-height:58px;padding:4px;font-size:10px}}</style></head><body><header><h1>다한닷 · 나의 업무보드</h1><p>DX·AX 현장 업무관리 | 과제 제출용 독립 체험판</p></header><main><div class="notice">실제 수행 업무를 바탕으로 공개용으로 재구성한 화면입니다. 일정 날짜와 보고서 요약은 설명용으로 편집했으며 개인 계정·업무 데이터베이스·외부 API와 연결하지 않습니다.</div><nav class="tabs" id="tabs"><button data-view="work" class="active">업무 목록</button><button data-view="calendar">달력 · 업무 이력</button><button data-view="links">업무 바로가기</button></nav><div class="layout"><section id="primary"></section><aside><div class="panel"><h2>오늘의 주요 내용</h2><div id="brief"></div></div><div class="panel"><h2>OneDrive 최근 자료</h2><div id="reports"></div></div></aside></div></main><script>const tasks=[["AX 부트캠프 과제 제출","교육·AX","진행","업무보드 체험 화면, 보안 점검, 제출 설명 정리"],["공정관리 시스템 업무 협의","공정관리","진행","현장 엑셀 유지, 골구도 실적 반영, 본사 취합 기준 검토"],["DXT 주간 회의","DXT","예정","출역·자재·프로세스맵·AI 에이전트 추진 현황 공유"],["자재관리 시스템 개발 검토","자재관리","진행","본사불 발주·반입·잔량 연계와 송장 수기 보완 검토"],["공무책임자 AI 에이전트","공무 AX","진행","기성·공문·회의록 중 우선 적용 업무 선정"],["프로세스맵 3·4단지 확대","프로세스맵","예정","공사기간과 공종별 마일스톤 재배치 검토"],["출역관리 운영 개선","출역관리","예정","협력업체 입력 및 승인 흐름 피드백 취합"],["레미콘 관제 검증","레미콘","예정","계근·배합표·관제 데이터 비교"],["월간업무보고 취합기 점검","자동화","진행","PPTX 슬라이드 크기 혼재 오류 재현"]],reports=[["자재관리 시스템 개발방향 검토","발주 품목의 반입 입력·확인·대시보드 흐름을 정리하고 ERP 발주내역 연결과 송장 인식 후 수기 검토 한계를 기술."],["공정관리 시스템 개선 검토","현장 엑셀 양식 유지, 계획·실적 비교, 골구도 반영, 자료 미제출과 지연 구분, 본사 취합 방향 검토."],["공무책임자 AI 에이전트 업무 구조화","공무책임자 업무를 일·주·월 단위로 구조화하고 기성·공문·계약·회의록의 산출물과 후속 업무를 연결."],["DX 운영체계 주간업무보고","출역·자재·프로세스맵·레미콘·공무 에이전트의 실시사항, 예정사항, 미결사항 구분."],["월간업무보고 자동취합기 오류 검토","PPTX 슬라이드 크기 혼재, 목차 정렬, 내부 이동 링크의 오류 가능성을 점검."]],shortcuts=[["AX 과제 Slack","https://slack.com/signin"],["AX 교육 교재","https://drive.google.com/"],["두레이 대화방","https://dooray.com/"],["두레이 받은 메일","https://dooray.com/"],["주간업무보고","https://www.microsoft365.com/"],["OneDrive","https://onedrive.live.com/"]];const $=s=>document.querySelector(s);const today=new Date();const fmt=d=>d.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'});const item=(t,i)=>'<div class="item"><span class="tag">'+t[1]+'</span><span class="meta">'+t[2]+'</span><h3>'+t[0]+'</h3><p>'+t[3]+'</p></div>';$('#brief').innerHTML=tasks.slice(0,3).map(item).join('');$('#reports').innerHTML=reports.map((r,i)=>'<div class="item"><h3>'+r[0]+'.pdf</h3><p>'+r[1]+'</p><span class="meta">업무 기반 공개용 요약 · 원본 링크 비공개</span></div>').join('');function show(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='work')$('#primary').innerHTML='<div class="panel"><h2>업무 목록 · 진행 및 예정</h2>'+tasks.map(item).join('')+'</div><div class="panel"><h2>다가오는 업무</h2>'+tasks.slice(3).map(item).join('')+'</div>';if(view==='links')$('#primary').innerHTML='<div class="panel"><h2>업무 바로가기</h2><p class="muted">외부 서비스의 공식 로그인 진입점입니다. 사내 페이지는 로그인 후 권한에 따라 직접 선택해야 합니다.</p><div class="links">'+shortcuts.map(s=>'<a target="_blank" rel="noopener noreferrer" href="'+s[1]+'">'+s[0]+' ↗</a>').join('')+'</div></div>';if(view==='calendar'){const y=today.getFullYear(),m=today.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells=['일','월','화','수','목','금','토'].map(d=>'<div class="dayhead">'+d+'</div>').join('');for(let i=0;i<first;i++)cells+='<div></div>';for(let i=1;i<=days;i++){const idx=(i+days-today.getDate())%days;cells+='<div class="cell">'+i+(i>=today.getDate()&&i<today.getDate()+tasks.length?'<small>'+tasks[(i-today.getDate())%tasks.length][0]+'</small>':'')+'</div>';}$('#primary').innerHTML='<div class="panel"><h2>'+y+'년 '+(m+1)+'월 · 업무 달력</h2><div class="calendar">'+cells+'</div></div><div class="panel"><h2>업무 이력 · 검토 및 진행 기록</h2><div class="history">'+tasks.map((t,i)=>'<div class="item"><span class="meta">'+fmt(new Date(y,m,Math.max(1,today.getDate()-i)))+' · 업무 기록</span><h3>'+t[0]+'</h3><p>'+t[3]+'</p></div>').join('')+'</div></div>';}}$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)show(b.dataset.view)});show('work');</script></body></html>
