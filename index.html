  :m.event_id===target.event_id||(m.changes||[]).some(c=>c.kind==='event'&&c.id===target.event_id));

 if(!state.workspace||state.weatherBusy||(!force&&!dateChanged&&Date.now()-weatherAttempt<1800000))return;

 const results=await Promise.allSettled(WEATHER_CITIES.map(c=>fetchWeather(fetch,new Date(),c.id)));

function taskCard(t){const pending=messagesForTarget(state.messages,{task_id:t.id}).filter(m=>m.resolution_status==='pending').length;return `<article class="task-card"><span class="task-state-dot ${t.status==='done'?'done':''}" aria-hidden="true">${t.status==='done'?'✓':t.status==='partial'?'◐':'◌'}</span><button class="task-open" data-task="${esc(t.id)}"><div class="task-title">${esc(t.title)}</div><div class="task-meta">${statusBadge(t.status)}${pending?`<span class="badge review">입력한 대화 ${pending}</span>`:''}${t.pending_review?'<span class="badge review">원본 변경</span>':''}<span>${esc(t.project)}</span>${t.due_date?`<span>마감 ${dateLabel(t.due_date)}</span>`:''}${t.next_review_on?`<span>다음 확인 ${dateLabel(t.next_review_on)}</span>`:''}</div>${t.remaining_action&&t.status!=='done'?`<p class="task-note remaining">남은 일 · ${esc(t.remaining_action)}</p>`:t.next_action&&t.status!=='done'?`<p class="task-note">${esc(t.next_action)}</p>`:''}${t.note?`<p class="task-note">${esc(t.note.slice(0,110))}${t.note.length>110?'…':''}</p>`:''}</button><span class="chevron">›</span></article>`;}
function agenda(events){return events.filter(e=>!e.excluded).map(e=>`<div class="agenda-item"><small>${e.all_day?`${dateLabel(e.start_at)} · 종일`:kstTime(e.start_at)}${e.personal_changed?' · 내 일정 조정':''}${e.status==='tentative'?' · 참석 확인 필요':''}</small><strong>${esc(e.title)}</strong>${link(e.url,'일정 원문')}<p class="muted">${esc(e.personal_note||e.note||'')}</p><button class="text-btn event-converse" data-event="${esc(e.id)}">이 일정에 대해 이야기하기 →</button></div>`).join('')||empty('등록된 일정이 없습니다.');}
function historyList(items){return `<div class="timeline">${items.map(h=>`<div class="timeline-item"><button data-history="${esc(h.id)}"><small>${kstTime(h.occurred_at)} · ${esc(h.actor)} · ${esc(h.action)}</small><strong>${esc(h.after_data.title)}</strong><p>${h.before_data?`${esc(statuses[h.before_data.status])} → `:''}${esc(statuses[h.after_data.status])}${h.after_data.note?` · ${esc(h.after_data.note.slice(0,130))}`:''}</p></button></div>`).join('')}</div>`;}
function calendarView(){
 const start=state.month+'-01',offset=new Date(start+'T00:00:00Z').getUTCDay(),first=addDays(start,-offset),monthHistory=historyForMonth(state.history,state.month),monthly=state.calendarScope==='history',monthLabel=state.month.replace('-','년 ')+'월';
 const cells=Array.from({length:42},(_,i)=>{const d=addDays(first,i),count=state.tasks.filter(t=>!t.archived&&(t.due_date===d||t.next_review_on===d)).length,activity=monthHistory.filter(h=>day(h.occurred_at)===d).length+state.messages.filter(m=>day(m.created_at)===d).length,events=state.events.filter(e=>eventOnDay(e,d)).length;return `<button class="day ${d.slice(0,7)!==state.month?'outside':''} ${d===state.selected?'selected':''} ${d===day()?'today':''}" data-day="${d}" aria-label="${dateLabel(d)} 업무 ${count}건 일정 ${events}건 기록 ${activity}건"><b>${+d.slice(8)}</b><span class="day-count">${count?`업 ${count} `:''}${events?`일 ${events}`:''}${activity?`<br>기록 ${activity}`:''}</span></button>`;}).join('');
 const records=[...state.events.filter(e=>eventOnDay(e,state.selected)).map(data=>({kind:'event',data})),...state.tasks.filter(t=>!t.archived&&(t.due_date===state.selected||t.next_review_on===state.selected)).map(data=>({kind:'task',data})),...monthHistory.filter(h=>day(h.occurred_at)===state.selected).map(data=>({kind:'history',data})),...state.messages.filter(m=>day(m.created_at)===state.selected).map(data=>({kind:'message',data}))];
 const unavailable=state.historyLoading&&!demo?'이달의 기록을 불러오고 있습니다…':state.historyError;
 const content=monthly?(unavailable?`<div class="empty" role="status">${esc(unavailable)}</div>`:pageList(monthHistory,'history',h=>historyList([h]),120,'이달에 저장된 변경 기록이 없습니다.')):pageList(records,'day',r=>r.kind==='event'?agenda([r.data]):r.kind==='task'?taskCard(r.data):r.kind==='history'?historyList([r.data]):messageCard(r.data),120,'이날의 업무·일정·처리 기록이 없습니다.');
 return `<div class="calendar-layout" data-calendar-pane="${state.calendarPane}"><section class="panel month-panel"><div class="panel-head"><input id="calendarMonth" class="calendar-month-select" aria-label="조회 월" type="month" value="${state.month}"><div class="calendar-tools"><button class="icon-btn" id="prevMonth" aria-label="이전 달">‹</button><button class="btn" id="calendarToday">오늘</button><button class="icon-btn" id="nextMonth" aria-label="다음 달">›</button></div></div><div class="calendar-grid">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="calendar-legend">업: 마감·다음 확인 / 일: 일정 / 기록: 대화·진척·완료</div><div class="calendar-record-actions"><button class="text-btn" data-calendar-scope="history">월별 기록 ${monthHistory.length}건 →</button><button class="text-btn day-record-button" data-calendar-scope="day">선택일 기록 →</button></div></section><section class="panel paged-panel day-panel"><div class="panel-head"><div><h2>${monthly?monthLabel+' 변경 기록':dateLabel(state.selected)}</h2>${monthly?`<small>업무 흐름·메모 기록 ${monthHistory.length}건</small>`:''}</div><button class="text-btn day-record-button" data-calendar-pane="month">달력으로</button></div><nav class="calendar-scope" aria-label="기록 범위"><button data-calendar-scope="day" aria-pressed="${!monthly}">선택일</button><button data-calendar-scope="history" aria-pressed="${monthly}">월별 기록</button></nav>${!monthly&&unavailable?`<p class="widget-alert" role="status">${esc(unavailable)}</p>`:''}${monthly?'<p class="record-hint">업무 상태·메모의 변경을 월별로 모았습니다. 기록을 누르면 당시 상태와 메모를 확인할 수 있습니다.</p>':''}${content}</section></div>`;
}

function bodyView(){

 const tasks=state.tasks.filter(t=>matchesTask(t,state.view==='work'?state.taskFilter:state.view,state.query)&&(!state.project||t.project===state.project)&&(!state.status||t.status===state.status)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||(a.next_review_on||a.due_date||'9999').localeCompare(b.next_review_on||b.due_date||'9999')||['high','normal','low'].indexOf(a.priority)-['high','normal','low'].indexOf(b.priority));

// Keep the decoded image and both animation playheads through board refreshes.
function captureScenery(){
 const node=$('.scenic-banner'),image=node?.querySelector('img');
 return {node,times:new Map((image?.getAnimations()||[]).map(a=>[a.animationName,a.currentTime]))};
}
function restoreScenery({node,times}){
 if(!node)return;
 $('.scenic-banner').replaceWith(node);
 for(const animation of node.querySelector('img').getAnimations()){
  const time=times.get(animation.animationName);
  if(Number.isFinite(time))animation.currentTime=time;
 }
}

async function changeMonth(month){
 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return;
 state.pages.day=0;state.pages.history=0;state.month=month;state.selected=month===day().slice(0,7)?day():month+'-01';state.historyError='';
 const loading=loadHistory();render();try{await loading;}catch(e){toast(errorMessage(e));}render();
}
function navigate(view){state.view=view;state.query='';state.status='';state.project='';state.pages={};state.mobilePanel='work';render();}
function bind(){
 app.querySelectorAll('[data-view]').forEach(n=>n.onclick=()=>navigate(n.dataset.view));app.querySelectorAll('[data-home]').forEach(n=>n.onclick=async()=>{state.month=day().slice(0,7);state.selected=day();state.calendarPane='month';state.calendarScope='day';state.weatherCity=0;state.rail='files';state.taskFilter='today';navigate('work');try{await loadHistory();}catch(e){toast(errorMessage(e));}});
 app.querySelectorAll('[data-task-filter]').forEach(b=>b.onclick=()=>{state.taskFilter=b.dataset.taskFilter;state.status='';state.pages.tasks=0;render();});
 app.querySelectorAll('[data-help]').forEach(b=>b.onclick=openGuide);
 app.querySelectorAll('[data-link-remove]').forEach(b=>b.onclick=()=>setLinkRemoved(b.dataset.linkRemove,true));
 app.querySelectorAll('[data-link-restore]').forEach(b=>b.onclick=()=>setLinkRemoved(b.dataset.linkRestore,false));
 if($('#showRemovedLinks'))$('#showRemovedLinks').onclick=()=>{state.showRemovedLinks=!state.showRemovedLinks;state.pages.links=0;render();};
 $('#mobileView').onchange=e=>navigate(e.target.value);app.querySelectorAll('[data-logout]').forEach(n=>n.onclick=logout);
 $('#themeToggle').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;render();};
 app.querySelectorAll('[data-rail]').forEach(b=>b.onclick=()=>{state.rail=b.dataset.rail;state.mobilePanel=b.dataset.rail;render();});app.querySelectorAll('[data-mobile-panel]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{state.mobilePanel=b.dataset.mobilePanel;render();};});
 app.querySelectorAll('[data-calendar-scope]').forEach(b=>b.onclick=()=>{state.calendarScope=b.dataset.calendarScope;state.calendarPane='day';state.pages.history=0;render();});
 app.querySelectorAll('button[data-calendar-pane]').forEach(b=>b.onclick=()=>{state.calendarPane=b.dataset.calendarPane;render();});
 app.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>showInfo(b.dataset.info));
 $('#sceneryToggle').onclick=()=>{sceneryPaused=!sceneryPaused;const banner=$('.scenic-banner');banner.classList.toggle('paused',sceneryPaused);$('#sceneryToggle').textContent=sceneryPaused?'▷':'Ⅱ';$('#sceneryToggle').setAttribute('aria-pressed',String(sceneryPaused));$('#sceneryToggle').setAttribute('aria-label','풍경 움직임 '+(sceneryPaused?'재생':'멈춤'));};
 app.querySelectorAll('[data-refresh]').forEach(b=>b.onclick=manualRefresh);if($('#applyUpdate'))$('#applyUpdate').onclick=applyUpdate;app.querySelectorAll('[data-compose]').forEach(b=>b.onclick=()=>openConversation({}));bindWeather();bindItems(app);bindPaging();
 if($('#search')){const applySearch=e=>{if(e.isComposing)return;clearTimeout(searchTimer);const input=e.target;searchTimer=setTimeout(()=>{state.query=input.value;state.pages.tasks=0;const pos=input.selectionStart;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos);},180);};$('#search').oninput=applySearch;$('#search').oncompositionend=applySearch;$('#projectFilter').onchange=e=>{state.project=e.target.value;state.pages.tasks=0;render();};$('#statusFilter').onchange=e=>{state.status=e.target.value;state.pages.tasks=0;render();};}
 if($('#prevMonth')){$('#prevMonth').onclick=()=>changeMonth(addDays(state.month+'-01',-1).slice(0,7));$('#nextMonth').onclick=()=>changeMonth(monthBounds(state.month)[1].slice(0,7));$('#calendarToday').onclick=()=>changeMonth(day().slice(0,7));app.querySelectorAll('[data-day]').forEach(n=>n.onclick=async()=>{const d=n.dataset.day;if(d.slice(0,7)!==state.month)await changeMonth(d.slice(0,7));state.selected=d;state.pages.day=0;state.calendarScope='day';state.calendarPane='day';render();});}

function bindItems(root){root.querySelectorAll('[data-task]').forEach(n=>n.onclick=()=>openTask(state.tasks.find(t=>t.id===n.dataset.task)));root.querySelectorAll('[data-event]').forEach(n=>n.onclick=()=>openConversation({event_id:n.dataset.event}));root.querySelectorAll('[data-converse]').forEach(n=>n.onclick=()=>openConversation({}));root.querySelectorAll('[data-message]').forEach(n=>n.onclick=()=>{const m=state.messages.find(x=>x.id===n.dataset.message);if(m)openConversation({task_id:m.task_id,event_id:m.event_id}).then(()=>{threadPage=messagesForTarget(state.messages,conversationTarget).findIndex(x=>x.id===m.id);refreshConversation();});});root.querySelectorAll('[data-history]').forEach(n=>n.onclick=()=>showHistory([...state.history,...detailHistory].find(h=>String(h.id)===n.dataset.history)));}
function conversationList(messages,compact=false){if(!messages.length)return `<div class="conversation-empty"><span>◌</span><strong>어디까지 진행하셨나요?</strong><p>처리한 일, 남은 일, 바뀐 생각을<br>평소 이야기하듯 남겨주세요.</p></div>`;return `<div class="conversation-list ${compact?'compact':''}">${[...messages].sort((a,b)=>a.created_at.localeCompare(b.created_at)||a.id.localeCompare(b.id)).map(m=>`<article class="conversation-turn"><div class="message-meta"><span>나 · ${kstTime(m.created_at)}</span><span class="message-state ${m.resolution_status}">${esc(messageStatuses[m.resolution_status]||m.resolution_status)}</span></div>${compact?`<button class="message-context" data-message="${esc(m.id)}">${esc(state.tasks.find(t=>t.id===m.task_id)?.title||state.events.find(e=>e.id===m.event_id)?.title||'자유롭게 남긴 이야기')} ↗</button>`:''}<div class="message-bubble user-message">${esc(m.body)}</div>${m.reply?`<div class="assistant-label"><span class="tiny-mark">d.</span>다한닷 <small>${kstTime(m.resolved_at)}</small></div><div class="message-bubble assistant-message">${esc(m.reply)}</div>`:'<p class="pending-caption">현재 화면에만 보관했습니다. 서버 전송과 AI 자동 처리는 하지 않습니다.</p>'}</article>`).join('')}</div>`;}
function messageCard(m){return `<article class="message-card"><small>${kstTime(m.created_at)} · ${esc(messageStatuses[m.resolution_status])}</small><button data-message="${esc(m.id)}"><strong>${esc(state.tasks.find(t=>t.id===m.task_id)?.title||state.events.find(e=>e.id===m.event_id)?.title||'자유롭게 남긴 이야기')}</strong><p>${esc(m.body)}</p><span>${esc(m.reply||'현재 화면에 보관')}</span><b class="message-read">대화 전체 보기 →</b></button></article>`;}
function conversationView(){const pending=state.messages.filter(m=>m.resolution_status==='pending').length;return `<section class="panel paged-panel conversation-feed"><div class="panel-head"><h2>나눈 이야기</h2><span class="badge ${pending?'review':''}">${pending?`화면 보관 ${pending}건`:'업무 대화 기록'}</span></div><p class="conversation-page-note">${esc(CONTENT.guides[3][1].split(".")[0])}.</p>${pageList([...state.messages].reverse(),'messages',messageCard,180,'아직 나눈 이야기가 없습니다. 대화로 남기기를 눌러주세요.')}</section>`;}

function contextSummary(){const t=state.tasks.find(t=>t.id===conversationTarget.task_id),e=state.events.find(e=>e.id===conversationTarget.event_id);if(t)return `<section class="conversation-context"><div class="task-meta">${statusBadge(t.status)}${t.archived?'<span class="badge">보관됨</span>':''}${t.next_review_on?`<span>다음 확인 ${dateLabel(t.next_review_on)}</span>`:''}${t.due_date?`<span>마감 ${dateLabel(t.due_date)}</span>`:''}</div><h3>${esc(t.title)}</h3>${t.remaining_action?`<p>남은 일 · ${esc(t.remaining_action)}</p>`:''}<small>${esc(CONTENT.guides[3][1].split(".")[0])}.</small></section>`;if(e)return `<section class="conversation-context"><div class="task-meta"><span>${e.excluded?'내 업무보드에서 제외됨':e.all_day?dateLabel(e.start_at)+' · 종일':kstTime(e.start_at)}</span></div><h3>${esc(e.title)}</h3>${e.personal_note?`<p>${esc(e.personal_note)}</p>`:''}<small>업무보드에 표시할 일정과 준비할 일을 이야기해 주세요.</small></section>`;return '<section class="conversation-context"><h3>어떤 이야기든 편하게 남겨주세요.</h3><p>새로운 업무도, 여러 업무의 진행 상황도 한 번에 적어도 됩니다.</p></section>';}
function threadHTML(){const messages=messagesForTarget(state.messages,conversationTarget),p=paginate(messages,threadPage,1);threadPage=p.page;return conversationList(p.items)+pager('thread',p);}
function bindThread(){const thread=$('#conversationThread');thread?.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{threadPage=+b.dataset.index;refreshConversation();});}

function renderDetailHistory(){const node=$('#detailHistory');if(!node)return;const p=paginate(detailHistory,detailPage,3);detailPage=p.page;node.innerHTML=historyList(p.items)+pager('detailHistory',p);bindItems(node);node.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{detailPage=+b.dataset.index;renderDetailHistory();});}

 $('#detail').innerHTML=`<form id="conversationForm"><div class="dialog-head"><div><p class="eyebrow">A CONVERSATION WITH DAHANDOT</p><h2>${task?'업무 이야기':event?'일정 이야기':'다한닷에게 남기기'}</h2></div><button type="button" class="icon-btn" id="closeConversation" aria-label="닫기">×</button></div><div class="dialog-body conversation-body"><div id="conversationContext">${contextSummary()}</div><div id="conversationThread">${threadHTML()}</div>${task||event?`<details class="previous-records"><summary>이전 메모 · 원문 · 변경 이력</summary>${task?.note?`<div class="legacy-note">${esc(task.note)}</div>`:''}${task?.source_refs?.map(r=>`<div class="ref">${link(r.url,r.label)}<p>${esc(r.excerpt)}</p></div>`).join('')||''}${event?link(event.url,'일정 원문'):''}<div id="detailHistory"></div></details>`:''}</div><div class="conversation-compose"><label class="conversation-label" for="conversationText">진행한 내용을 편하게 적어주세요</label><textarea id="conversationText" rows="3" maxlength="12000" required placeholder="자료는 보냈어. 금요일에 답변만 확인하면 돼.">${esc(draft.body)}</textarea><details class="conversation-timing"><summary>${esc(CONTENT.guides[3][0])}</summary><p>${esc(CONTENT.guides[3][1])}</p></details><div id="conversationError" class="error" role="alert"></div></div><div class="dialog-foot"><span class="save-caption">${demo?'체험 대화 · 실제 저장 없음':'즉시 저장 · 다음 갱신 때 정리'}</span><span class="spacer"></span><button type="submit" class="btn primary" id="sendConversation">대화 남기기 ↑</button></div></form>`;
 $('#closeConversation').onclick=()=>$('#detail').close();$('#conversationText').oninput=e=>{const previous=drafts.get(key);drafts.set(key,{body:e.target.value,id:previous?.body===e.target.value?previous.id:crypto.randomUUID()});};$('#conversationForm').onsubmit=sendConversation;$('#detail').showModal();bindThread();$('#detail .dialog-body').scrollTop=$('#detail .dialog-body').scrollHeight;
 if(task){try{const id=task.id;detailHistory=state.history.filter(h=>h.task_id===id);if(conversationTarget.task_id!==id||!$('#detailHistory'))return;renderDetailHistory();}catch(e){if($('#detailHistory'))$('#detailHistory').textContent='이력을 불러오지 못했습니다: '+errorMessage(e);}}
}
