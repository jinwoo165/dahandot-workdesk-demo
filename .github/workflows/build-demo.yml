name: Build independent demo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_demo.py'
      - 'demo-content.json'
      - 'release-approval.json'
      - '.github/workflows/build-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-demo-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jinwoo165/dahandot-workdesk-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone presentation without backend credentials
        run: python scripts/build_demo.py
      - name: Approve only the exact browser-tested release
        id: approved
        shell: python
        run: |
          from pathlib import Path
          import json, os
          approval = Path('release-approval.json')
          ok = approval.exists() and json.loads(approval.read_text()).get('sha256') == json.loads(Path('build-report.json').read_text())['sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ok=' + str(ok).lower() + '\n')
          print('Tested release checksum matches:', ok)
      - name: Commit only approved standalone release to this demo repository
        if: steps.approved.outputs.ok == 'true'
        run: |
          test "$GITHUB_REPOSITORY" = 'jinwoo165/dahandot-workdesk-demo'
          test "$GITHUB_REF" = 'refs/heads/main'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll build-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish browser-tested standalone demo [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: independent-demo-build
          path: |
            index.html
            build.js
            build-report.json
            demo-content.json
            scripts/build_demo.py
          retention-days: 14
          if-no-files-found: error
