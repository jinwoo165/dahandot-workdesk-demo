name: Build independent demo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'demo-content.json'
      - '.github/workflows/build-demo.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-demo-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jinwoo165/dahandot-workdesk-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone presentation without backend credentials
        run: |
          python scripts/build_demo.py
          python scripts/refine_demo.py
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, controls, memory-only input and network isolation
        run: python scripts/test_demo.py
      - name: Commit only the tested standalone release to this demo repository
        run: |
          test "$GITHUB_REPOSITORY" = 'jinwoo165/dahandot-workdesk-demo'
          test "$GITHUB_REF" = 'refs/heads/main'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp qa/test-report.json verification.json
          git add index.html .nojekyll build-report.json verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish browser-tested standalone demo [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-demo-build
          path: |
            index.html
            build.js
            build-report.json
            demo-content.json
            scripts
            qa
          retention-days: 14
          if-no-files-found: error
